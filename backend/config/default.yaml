# Einstellungen für AMV-Forge. Alles, was man tunen will, steht hier statt im Code.

quick:
  # Nur mit --uniform: alle wie viele Beats geschnitten wird (1 = jeder Beat, 4 = jeder Takt bei 4/4).
  # Ohne --uniform richtet sich die Schnittrate nach den Song-Abschnitten (siehe "cuts").
  beats_per_cut: 2
  # Kürzere Slots am Ende werden mit dem vorherigen zusammengelegt.
  min_slot_seconds: 0.25
  # Grober OP/ED-Schutz bis Phase 2: so viele Sekunden am Anfang/Ende der Folge ignorieren.
  skip_start_seconds: 0
  skip_end_seconds: 0

scenes:
  # AdaptiveDetector: höher = weniger, längere Szenen.
  adaptive_threshold: 3.0
  # Kürzeste erlaubte Szene in Frames.
  min_scene_len_frames: 12

render:
  width: 1080
  height: 1920
  preview_width: 480
  preview_height: 854
  fps: 30
  crf: 20
  preset: veryfast
  audio_bitrate: 192k

# ---------------------------------------------------------------- Phase 2: Staffel-Index

database:
  # SQLite-Datei mit Staffeln, Folgen, Clips, Charakteren und dem API-Cache.
  path: data/amv_forge.sqlite

index:
  # Standardquelle, wenn --source fehlt: jellyfin oder folder.
  source: folder
  # Dateiendungen, die im Ordner-Modus als Folge zählen.
  video_extensions: [".mkv", ".mp4", ".m4v", ".avi", ".webm"]
  # Hierhin werden Folgen aus Jellyfin heruntergeladen (einmalig).
  download_dir: data/cache/episodes
  # Kürzere Clip-Reste nach dem OP/ED-Abschneiden werden verworfen.
  min_clip_seconds: 0.5

apis:
  # Mindestabstand zwischen zwei Anfragen pro Dienst (Sekunden), damit wir kein Rate-Limit reißen.
  anilist_interval: 2.1
  jikan_interval: 1.1
  aniskip_interval: 0.5
  timeout_seconds: 30
  # So lange wird auf den Verbindungsaufbau gewartet. Antwortet ein Dienst gar nicht,
  # wird er nach einem weiteren Versuch für den Rest des Laufs übersprungen.
  connect_timeout_seconds: 5
  connection_retries: 1
  # Wiederholungen bei Rate-Limit (HTTP 429) oder Serverfehlern (5xx).
  max_retries: 4
  # AniList-Treffer müssen so gut zum Suchbegriff passen (0-1), sonst lieber --anilist-id.
  anilist_min_title_score: 0.75
  # AniSkip-Zeiten aus Dateien, die mehr als so viele Sekunden länger/kürzer sind, werden verworfen.
  aniskip_max_length_diff: 15

op_ed:
  # Fallback, wenn AniSkip nichts weiß: gleiche Musik in zwei Folgen suchen.
  head_seconds: 420        # OP wird in den ersten 7 Minuten gesucht (wegen Cold Open)
  tail_seconds: 240        # ED in den letzten 4 Minuten
  min_seconds: 40          # kürzer ist kein OP/ED
  max_seconds: 130         # länger auch nicht
  similarity: 0.90         # ab wann zwei Momente als "gleiche Musik" gelten (0-1)
  max_gap_seconds: 2.0     # kurze Aussetzer im Treffer werden überbrückt
  silence_db: -45          # leisere Stellen zählen nicht (Stille ist in jeder Folge gleich)
  # Finden AniSkip und Audio-Vergleich beide ein OP/ED, müssen sie sich so stark überlappen (0-1).
  # Sonst gewinnt der Audio-Vergleich, weil er auf deiner Datei gemessen ist.
  min_overlap: 0.5

# ---------------------------------------------------------------- Phase 3: Song-Struktur

music:
  # auto = allin1, wenn installiert, sonst librosa. allin1 oder librosa erzwingt den Analysator.
  analyzer: auto
  sample_rate: 22050
  beats_per_bar: 4
  # Hier legt allin1 seine Zwischendateien ab (werden danach gelöscht).
  allin1_work_dir: data/cache/allin1
  # Energiekurve: so viele Werte pro Sekunde, Mischung der drei Signale, Glättung.
  energy_rate: 10
  energy_weights:
    loudness: 0.5
    onset: 0.25
    bass: 0.25
  energy_smooth_seconds: 1.0
  # librosa-Fallback für Abschnitte
  min_section_bars: 4       # kürzer ist kein eigener Abschnitt
  novelty_bars: 4           # so viele Takte vor/nach einer Grenze werden verglichen
  novelty_threshold: 0.5    # 0-1, höher = weniger Abschnitte
  chorus_energy: 0.7        # ab dieser Energie (0-1) ist ein Abschnitt ein Refrain
  calm_energy: 0.35         # darunter ist ein Abschnitt ruhig (Intro, Outro, Bridge)
  # Drops: Energie der 2 Takte danach minus die 2 Takte davor
  drop_window_bars: 2
  drop_min_jump: 0.2        # so stark muss die Energie springen (0-1)
  drop_min_level: 0.75      # so laut muss es danach sein (0-1)
  drop_min_distance_bars: 8
  max_drops: 4

cuts:
  # Alle wie viele Beats pro Abschnitt geschnitten wird. 0.5 = zwei Schnitte pro Beat.
  beats_per_cut:
    intro: 4
    verse: 2
    chorus: 1
    bridge: 2
    outro: 4
  # Ab jedem Drop wird so viele Takte lang im Drop-Tempo geschnitten, danach wie im Abschnitt.
  drop: 0.5
  drop_bars: 4
  # Vor jedem Drop: Build-up, in dem die Schnitte Takt für Takt dichter werden (von -> bis).
  buildup_bars: 4
  buildup_from: 4
  buildup_to: 1
  # Kürzer wird kein Clip, auch nicht im Drop (bei sehr schnellen Songs wird dann pro Beat geschnitten).
  min_cut_seconds: 0.18
  # Ohne --song-start wird der Ausschnitt so gelegt, dass der stärkste Drop bei 40 % des Edits kommt.
  drop_position: 0.4

motion:
  # Bewegung wird auf einer Mini-Version der Folge gemessen (schnell, reicht für die Stärke).
  fps: 12
  width: 160
  height: 90
  # So nah am Szenenwechsel wird die Bewegung ignoriert (der Schnitt selbst sieht aus wie Bewegung).
  edge_seconds: 0.2
  # Glättung für den Peak, in Messpunkten (3 = 0,25 s bei 12 fps)
  peak_smooth: 3
  cache_dir: data/cache/motion
  # Optional: Hardware-Dekodierung für ffmpeg, z. B. "auto" oder "cuda". Leer = aus.
  hwaccel: ""

planner:
  # Bewegung des Clips passend zur Energie des Songs wählen (Drop = viel Bewegung, Intro = ruhig).
  match_intensity: true
  # Aus den so vielen am besten passenden Clips wird zufällig einer gewählt (Abwechslung).
  pick_from_top: 8
  # Nicht öfter hintereinander Clips aus derselben Folge.
  max_same_episode_in_row: 2
