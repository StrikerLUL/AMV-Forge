# Einstellungen für AMV-Forge. Alles, was man tunen will, steht hier statt im Code.

quick:
  # Nur mit --uniform: alle wie viele Beats geschnitten wird (1 = jeder Beat, 4 = jeder Takt bei 4/4).
  # Ohne --uniform richtet sich die Schnittrate nach den Song-Abschnitten (siehe "cuts").
  beats_per_cut: 2
  # Kürzere Slots am Ende werden mit dem vorherigen zusammengelegt.
  min_slot_seconds: 0.25
  # Grober OP/ED-Schutz bis Phase 2: so viele Sekunden am Anfang/Ende der Folge ignorieren.
  skip_start_seconds: 0
  skip_end_seconds: 0

scenes:
  # AdaptiveDetector: höher = weniger, längere Szenen.
  adaptive_threshold: 3.0
  # Kürzeste erlaubte Szene in Frames.
  min_scene_len_frames: 12

render:
  width: 1080
  height: 1920
  preview_width: 480
  preview_height: 854
  fps: 30
  crf: 20
  preset: veryfast
  audio_bitrate: 192k

# ---------------------------------------------------------------- Phase 2: Staffel-Index

database:
  # SQLite-Datei mit Staffeln, Folgen, Clips, Charakteren und dem API-Cache.
  path: data/amv_forge.sqlite

index:
  # Standardquelle, wenn --source fehlt: jellyfin oder folder.
  source: folder
  # Dateiendungen, die im Ordner-Modus als Folge zählen.
  video_extensions: [".mkv", ".mp4", ".m4v", ".avi", ".webm"]
  # Hierhin werden Folgen aus Jellyfin heruntergeladen (einmalig).
  download_dir: data/cache/episodes
  # Kürzere Clip-Reste nach dem OP/ED-Abschneiden werden verworfen.
  min_clip_seconds: 0.5

apis:
  # Mindestabstand zwischen zwei Anfragen pro Dienst (Sekunden), damit wir kein Rate-Limit reißen.
  anilist_interval: 2.1
  jikan_interval: 1.1
  aniskip_interval: 0.5
  timeout_seconds: 30
  # So lange wird auf den Verbindungsaufbau gewartet. Antwortet ein Dienst gar nicht,
  # wird er nach einem weiteren Versuch für den Rest des Laufs übersprungen.
  connect_timeout_seconds: 5
  connection_retries: 1
  # Wiederholungen bei Rate-Limit (HTTP 429) oder Serverfehlern (5xx).
  max_retries: 4
  # AniList-Treffer müssen so gut zum Suchbegriff passen (0-1), sonst lieber --anilist-id.
  anilist_min_title_score: 0.75
  # AniSkip-Zeiten aus Dateien, die mehr als so viele Sekunden länger/kürzer sind, werden verworfen.
  aniskip_max_length_diff: 15

op_ed:
  # Fallback, wenn AniSkip nichts weiß: gleiche Musik in zwei Folgen suchen.
  head_seconds: 420        # OP wird in den ersten 7 Minuten gesucht (wegen Cold Open)
  tail_seconds: 240        # ED in den letzten 4 Minuten
  min_seconds: 40          # kürzer ist kein OP/ED
  max_seconds: 130         # länger auch nicht
  similarity: 0.90         # ab wann zwei Momente als "gleiche Musik" gelten (0-1)
  max_gap_seconds: 2.0     # kurze Aussetzer im Treffer werden überbrückt
  silence_db: -45          # leisere Stellen zählen nicht (Stille ist in jeder Folge gleich)
  # Finden AniSkip und Audio-Vergleich beide ein OP/ED, müssen sie sich so stark überlappen (0-1).
  # Sonst gewinnt der Audio-Vergleich, weil er auf deiner Datei gemessen ist.
  min_overlap: 0.5

# ---------------------------------------------------------------- Phase 3: Song-Struktur

music:
  # auto = allin1, wenn installiert, sonst librosa. allin1 oder librosa erzwingt den Analysator.
  analyzer: auto
  sample_rate: 22050
  beats_per_bar: 4
  # Hier legt allin1 seine Zwischendateien ab (werden danach gelöscht).
  allin1_work_dir: data/cache/allin1
  # Energiekurve: so viele Werte pro Sekunde, Mischung der drei Signale, Glättung.
  energy_rate: 10
  energy_weights:
    loudness: 0.5
    onset: 0.25
    bass: 0.25
  energy_smooth_seconds: 1.0
  # librosa-Fallback für Abschnitte
  min_section_bars: 4       # kürzer ist kein eigener Abschnitt
  novelty_bars: 4           # so viele Takte vor/nach einer Grenze werden verglichen
  novelty_threshold: 0.5    # 0-1, höher = weniger Abschnitte
  chorus_energy: 0.7        # ab dieser Energie (0-1) ist ein Abschnitt ein Refrain
  calm_energy: 0.35         # darunter ist ein Abschnitt ruhig (Intro, Outro, Bridge)
  # Drops: Energie der 2 Takte danach minus die 2 Takte davor
  drop_window_bars: 2
  drop_min_jump: 0.2        # so stark muss die Energie springen (0-1)
  drop_min_level: 0.75      # so laut muss es danach sein (0-1)
  drop_min_distance_bars: 8
  max_drops: 4

cuts:
  # Alle wie viele Beats pro Abschnitt geschnitten wird. 0.5 = zwei Schnitte pro Beat.
  beats_per_cut:
    intro: 4
    verse: 2
    chorus: 1
    bridge: 2
    outro: 4
  # Ab jedem Drop wird so viele Takte lang im Drop-Tempo geschnitten, danach wie im Abschnitt.
  drop: 0.5
  drop_bars: 4
  # Vor jedem Drop: Build-up, in dem die Schnitte Takt für Takt dichter werden (von -> bis).
  buildup_bars: 4
  buildup_from: 4
  buildup_to: 1
  # Kürzer wird kein Clip, auch nicht im Drop (bei sehr schnellen Songs wird dann pro Beat geschnitten).
  min_cut_seconds: 0.18
  # Ohne --song-start wird der Ausschnitt so gelegt, dass der stärkste Drop bei 40 % des Edits kommt.
  drop_position: 0.4

motion:
  # Bewegung wird auf einer Mini-Version der Folge gemessen (schnell, reicht für die Stärke).
  fps: 12
  width: 160
  height: 90
  # So nah am Szenenwechsel wird die Bewegung ignoriert (der Schnitt selbst sieht aus wie Bewegung).
  edge_seconds: 0.2
  # Glättung für den Peak, in Messpunkten (3 = 0,25 s bei 12 fps)
  peak_smooth: 3
  cache_dir: data/cache/motion
  # Optional: Hardware-Dekodierung für ffmpeg, z. B. "auto" oder "cuda". Leer = aus.
  hwaccel: ""

planner:
  # Aus den so vielen am besten bewerteten Clips wird zufällig einer gewählt (Abwechslung).
  pick_from_top: 8
  # Nicht öfter hintereinander Clips aus derselben Folge.
  max_same_episode_in_row: 2
  # Nicht öfter hintereinander Clips mit derselben Figur (ab Phase 5, 0 = egal).
  # Figuren, die du mit --characters ausdrücklich willst, zählen nicht.
  max_same_character_in_row: 2
  # Score-Formel (Phase 4), Gewichte ohne --style. Jeder Stil in backend/styles/ überschreibt sie:
  # Score = mood*Stimmung + energy*(1 - |Bewegung - Song-Energie|) + character*Figuren
  #         + quality*Qualität - repeat*Wiederholung - dialog*Sprache im Clip
  weights:
    mood: 0.0        # passt die Stimmung des Clips zum Stil?
    energy: 1.0      # passt die Bewegung zur Energie des Songs an der Stelle (Drop = viel Bewegung)?
    character: 1.0   # wie sicher die Figuren aus --characters im Bild sind (ohne --characters egal)
    quality: 0.3     # Bildqualität 0-1
    repeat: 0.3      # Abzug, wenn die Folge in den letzten Clips schon oft dran war
    dialog: 0.0      # Abzug für Clips, in denen geredet wird (Mundbewegung ohne Ton wirkt komisch)
  # So viele der letzten Clips zählen für "repeat"
  repeat_window: 6

# ---------------------------------------------------------------- Phase 4: Stimmungserkennung

keyframes:
  # Aus jedem Clip werden 1-3 Standbilder genommen (je nach Länge), CLIP schaut sie sich an.
  fps: 4                    # so dicht wird die Folge dafür abgetastet (4 = alle 0,25 s)
  height: 224               # Höhe der Standbilder in Pixeln (CLIP arbeitet mit 224x224)
  max_per_clip: 3
  seconds_per_frame: 1.5    # pro angefangene 1,5 s Cliplänge ein Standbild (höchstens max_per_clip)
  edge_seconds: 0.15        # Abstand zum Schnitt, dort sieht man oft noch die vorherige Szene
  # Ein Vorschaubild pro Clip (für 'moods' und später die Web-UI), ca. 15 KB pro Bild
  cache_dir: data/cache/keyframes
  jpeg_quality: 80

clip:
  # Bilderkennung ohne eigenes Training (Zero-Shot): CLIP vergleicht jedes Standbild mit den Sätzen in
  # backend/prompts/clip_prompts.yaml. Das Modell wird beim ersten Lauf heruntergeladen (ca. 600 MB).
  enabled: true
  model: ViT-B-32
  pretrained: laion2b_s34b_b79k
  # auto = GPU, wenn torch.cuda.is_available(), sonst CPU. Oder fest: cuda, cpu
  device: auto
  batch_size: 64
  # sides = 16:9-Bild in zwei quadratische Hälften teilen (nichts wird abgeschnitten),
  # center = nur die Mitte (halb so viel Rechenzeit), pad = Balken oben und unten
  crop: sides
  prompts: backend/prompts/clip_prompts.yaml
  # CLIP-Embedding pro Clip, eine .npz-Datei pro Folge. Damit gehen neue Prompts ohne neues Dekodieren.
  cache_dir: data/cache/clip

episode_audio:
  sample_rate: 16000
  # silero = Sprache mit Silero VAD erkennen, none = aus (dann zählen nur Untertitel als Dialog)
  vad: silero
  vad_threshold: 0.5
  # Ab diesem Anteil Sprache (0-1) gilt ein Clip als Dialog-Szene
  dialog_min_share: 0.3

subtitles:
  enabled: true
  # Bevorzugte Sprachen: Endung der Datei ("Folge.de.ass") oder Sprach-Tag der Spur in MKV/MP4
  languages: [de, ger, deu, en, eng]
  # Dateien, Spuren und ASS-Styles mit diesen Namen sind Schilder oder Liedtexte, kein Dialog
  skip_pattern: "(?i)(sign|song|lyric|kara|forced|\\btitles?\\b|\\bop\\b|\\bed\\b)"
  # Eine Zeile gehört zum Clip, wenn sie sich so lange mit ihm überschneidet (Sekunden)
  min_overlap_seconds: 0.2
  # Mehrsprachiges Satz-Modell (ca. 470 MB): vergleicht jede Zeile mit backend/prompts/dialog_prompts.yaml.
  # Leer = keine Einordnung, die Zeilen zählen dann nur als "hier wird geredet".
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  device: auto
  prompts: backend/prompts/dialog_prompts.yaml
  # Eingebettete Untertitel werden einmal hierhin extrahiert
  cache_dir: data/cache/subtitles

mood:
  # Wie stark jedes Signal in jede Stimmung eingeht (0 = gar nicht). Alle Signale werden vorher
  # innerhalb der Staffel auf 0-1 gebracht. Fehlt ein Signal (keine Untertitel, CLIP nicht
  # installiert), zählen nur die übrigen.
  #   clip      = Bildinhalt laut CLIP
  #   motion    = Bewegung: viel -> action, wenig -> romance, sad, calm
  #   audio     = Ton der Folge: laut -> action, funny; leise ohne Sprache -> romance, sad, calm
  #   subtitles = was gesagt wird (Geständnis, Streit, Witz ...)
  weights:
    clip:      {romance: 1.0, action: 0.8, sad: 1.0, funny: 1.0, calm: 0.8}
    motion:    {romance: 0.3, action: 1.0, sad: 0.2, funny: 0.0, calm: 0.6}
    audio:     {romance: 0.4, action: 0.4, sad: 0.2, funny: 0.2, calm: 0.4}
    subtitles: {romance: 0.6, action: 0.3, sad: 0.6, funny: 0.6, calm: 0.0}

quality:
  # Clips unter min_score kommen nie ins Edit.
  min_score: 0.4
  dark: 0.06              # hellste Stelle der Standbilder darunter (0-1): Schwarzbild
  bright: 0.95            # dunkelste Stelle darüber: Weißbild
  flat: 0.03              # Kontrast darunter: einfarbiges Bild
  # CLIP-Wahrscheinlichkeit für eine Gruppe unter "quality" in clip_prompts.yaml (Text, Abspann,
  # Logo, Unschärfe), ab der ein Clip rausfliegt
  prompt_threshold: 0.5
  # Clips mit weniger als 20 % der typischen Schärfe der Staffel (Median) gelten als verwackelt
  blurry_ratio: 0.2

# ---------------------------------------------------------------- Phase 5: Charaktere

faces:
  # Anime-Gesichter finden: ein kleines YOLOv8-Modell, das auf Anime-Gesichter trainiert ist (ONNX-Datei).
  # Es wird beim ersten Lauf von Hugging Face geladen und läuft mit onnxruntime.
  enabled: true
  repo: deepghs/anime_face_detection
  model: face_detect_v1.4_s/model.onnx
  # auto = GPU, wenn onnxruntime eine findet (CUDA oder DirectML), sonst CPU. Oder fest: cpu
  device: auto
  # Gesucht wird in denselben Standbildern wie bei CLIP, aber größer geholt (480 Pixel hoch)
  height: 480
  min_confidence: 0.35      # so sicher muss der Detektor sein (0-1)
  iou: 0.5                  # Rahmen, die sich stärker überlappen, gelten als dasselbe Gesicht
  min_size: 0.07            # kleinere Gesichter (Anteil der Bildhöhe) sind zum Wiedererkennen zu klein
  max_per_frame: 6
  # Ausschnitt zum Wiedererkennen: Gesicht mal 1,8, damit Haare und Frisur mit drauf sind
  crop_scale: 1.8
  # Pro Folge eine .npz-Datei mit Rahmen und CLIP-Embedding jedes Gesichts
  cache_dir: data/cache/faces

characters:
  # Bilder der Figuren von AniList (einmal heruntergeladen)
  image_dir: data/cache/characters
  # Eigene Vorbilder, falls das AniList-Bild schlecht passt: Screenshots in data/characters/<Name>/
  # (z. B. data/characters/Hori/1.png). Der Ordnername wird wie bei --characters gesucht.
  extra_dir: data/characters
  download_interval: 0.3    # Sekunden zwischen zwei Bild-Downloads
  # Welche Figuren von AniList gesucht werden (MAIN, SUPPORTING, BACKGROUND)
  roles: [MAIN, SUPPORTING]
  # Wiedererkennen: Jedes Gesicht wird mit einem "Vorbild" pro Figur verglichen. Am Anfang ist das
  # Vorbild das AniList-Bild. Danach wird es mehrmals verbessert: Die sichersten Treffer aus den
  # Folgen werden gemittelt (so sieht die Figur in DIESEM Anime wirklich aus).
  rounds: 3
  seed_faces: 5             # so viele eindeutigste Treffer pro Figur in Runde 1 (wenige, dafür sicher richtig)
  max_seed_faces: 300       # höchstens so viele in den späteren Runden
  seed_probability: 0.8     # ab dieser Sicherheit zählt ein Treffer fürs Vorbild
  reference_weight: 0.25    # so viel AniList-Bild bleibt im Vorbild (gegen Abdriften)
  # Sicherheit (0,5-1): wie deutlich die ähnlichste Figur vor der zweitähnlichsten liegt.
  # scale: wie stark ein kleiner Abstand schon zählt (größer = schneller sicher)
  scale: 50
  # Ab dieser Sicherheit gilt ein Gesicht als die Figur, sonst als "unbekannt"
  min_probability: 0.6
