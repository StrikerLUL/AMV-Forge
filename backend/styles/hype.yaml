# Stil "Hype": viel Bewegung, Kämpfe, Explosionen, Geschrei.

description: Action, hohe Bewegung, laute Szenen

# Für dieses Tempo sind die Schnittraten gedacht (ein 90-BPM-Song wird im doppelten Tempo gezählt)
bpm: [140, 175]

# Schnittrate: Build-up 1 pro Takt -> 1 pro Beat, Drop 1 pro halben Beat
cuts:
  beats_per_cut: {intro: 2, verse: 2, chorus: 1, bridge: 2, outro: 2}
  drop: 0.5
  drop_bars: 4
  buildup_bars: 4
  buildup_from: 4
  buildup_to: 1

# Harte Schnitte, Flash auf jedem Taktanfang und im Drop, Whip beim Wechsel des Abschnitts
transitions:
  default: cut
  downbeat: flash
  section: whip
  drop: flash

effects:
  look: punchy
  zoom_punch: {zoom: 0.12, at: downbeats, zones: [buildup, chorus, drop]}   # kurz ranzoomen auf der Eins
  shake: {strength: 0.015, zones: [drop]}
  # Speed-Ramp: direkt nach dem Schnitt (dort liegt der Bewegungs-Peak) Zeitlupe, dann schneller
  speed_ramp: {slow: 0.5, fast: 1.6, split: 0.4, zones: [intro, verse, bridge, outro, buildup], min_seconds: 0.6}

# Songvorschläge (Phase 7): Drop im Ausschnitt erwünscht (bis 1) oder unerwünscht (bis -1), 0 = egal
song:
  drop: 1.0        # ohne Drop kein Hype

mood:
  action: 1.0
  funny: 0.1
  sad: -0.3
  romance: -0.4
  calm: -0.7

pool: 0.3

weights:
  mood: 1.0
  energy: 0.6      # im Drop die wildesten Clips, im Intro die ruhigeren
  quality: 0.3
  repeat: 0.3
  dialog: 0.2
